[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "powerperf-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "pandas>=2.0", "matplotlib>=3.7", "numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]